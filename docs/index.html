<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bengaluru Vacancy Watcher</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --border:#2a2e37;
    --text:#e8e9ec; --muted:#9aa0ab;
    --high:#3ecf8e; --medium:#f0b429; --low:#5a6270;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:24px;
  }
  h1{font-size:20px; margin:0 0 4px;}
  .sub{color:var(--muted); font-size:13px; margin-bottom:20px;}
  .meta{display:flex; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
  .stat{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 16px; min-width:120px;}
  .stat .num{font-size:22px; font-weight:600;}
  .stat .lbl{font-size:12px; color:var(--muted);}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:16px; margin-bottom:12px;
  }
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
  .org{font-weight:600; font-size:15px;}
  .badge{
    font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px;
    text-transform:uppercase; letter-spacing:.03em;
  }
  .badge.High{background:rgba(62,207,142,.15); color:var(--high); border:1px solid rgba(62,207,142,.4);}
  .badge.Medium{background:rgba(240,180,41,.15); color:var(--medium); border:1px solid rgba(240,180,41,.4);}
  .badge.Low{background:rgba(90,98,112,.2); color:var(--low); border:1px solid rgba(90,98,112,.5);}
  .line{margin:10px 0; font-size:14px; line-height:1.5; color:var(--text);}
  .row{font-size:12.5px; color:var(--muted); margin-top:4px;}
  .kw{display:inline-block; background:#242830; border-radius:6px; padding:2px 8px; margin:2px 4px 0 0; font-size:11px;}
  a.src{color:#7aa2f7; text-decoration:none; font-size:12.5px;}
  #empty{color:var(--muted); padding:40px 0; text-align:center;}
  #refresh{
    background:#2a2e37; color:var(--text); border:1px solid var(--border);
    border-radius:8px; padding:8px 14px; cursor:pointer; font-size:13px; margin-bottom:16px;
  }
</style>
</head>
<body>
  <h1>Bengaluru Senior Admin / Procurement Vacancy Watcher</h1>
  <div class="sub">Checks IISc, NCBS-TIFR, ICTS-TIFR, RRI, NIMHANS, CPRI, CSIR-NAL, NLSIU, IIIT-B, BEL, BEML, HAL and ISRO Bengaluru daily. Updated automatically by GitHub Actions.</div>
  <button id="refresh" onclick="load()">Refresh</button>
  <div class="meta" id="meta"></div>
  <div id="list"></div>
  <div id="empty" style="display:none;">No matches recorded yet — the first daily run will populate this.</div>

<script>
async function load(){
  const list = document.getElementById('list');
  const meta = document.getElementById('meta');
  const empty = document.getElementById('empty');
  list.innerHTML = ''; meta.innerHTML = '';
  try{
    const res = await fetch('results.json?_=' + Date.now());
    const data = await res.json();
    const all = data.all_matches || [];
    const newCount = (data.new_this_run || []).length;
    meta.innerHTML = `
      <div class="stat"><div class="num">${all.length}</div><div class="lbl">Total matches on record</div></div>
      <div class="stat"><div class="num">${newCount}</div><div class="lbl">New in last run</div></div>
      <div class="stat"><div class="num">${data.last_run ? new Date(data.last_run).toLocaleDateString() : '—'}</div><div class="lbl">Last checked</div></div>
    `;
    if(all.length === 0){ empty.style.display='block'; return; }
    empty.style.display='none';
    for(const m of all){
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `
        <div class="card-top">
          <div class="org">${m.org}</div>
          <span class="badge ${m.relevance}">${m.relevance} match</span>
        </div>
        <div class="line">${m.line}</div>
        <div class="row">Pay-protection: ${m.pay_protection}</div>
        <div class="row">${(m.matched_keywords||[]).map(k => `<span class="kw">${k}</span>`).join('')}</div>
        <div class="row" style="margin-top:8px;"><a class="src" href="${m.source_url}" target="_blank">Open source page →</a> · first seen ${new Date(m.first_seen).toLocaleDateString()}</div>
      `;
      list.appendChild(div);
    }
  }catch(e){
    empty.style.display='block';
    empty.textContent = 'results.json not found yet — run the watcher once first.';
  }
}
load();
</script>
</body>
</html>
